<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, user-scalable=no, minimum-scale=1.0, maximum-scale=1.0">
    <title>Classic Margherita Pizza AR Viewer</title>
    <!-- A-Frame Library -->
    <script src="https://aframe.io/releases/1.3.0/aframe.min.js"></script>
    <!-- AR.js for A-Frame -->
    <script src="https://raw.githack.com/AR-js-org/AR.js/master/aframe/build/aframe-ar.js"></script>
    <style>
      body {
        margin: 0;
        overflow: hidden;
        background-color: transparent !important;
        font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      }
      canvas.a-canvas { z-index: 1 !important; }
      .a-video-stage { z-index: 0 !important; }
      #ar-instructions {
        position: fixed;
        bottom: 30px;
        left: 50%;
        transform: translateX(-50%);
        background: rgba(0, 0, 0, 0.8);
        border: 1px solid rgba(255, 255, 255, 0.15);
        color: white;
        padding: 14px 28px;
        border-radius: 9999px;
        font-size: 13px;
        font-weight: 500;
        letter-spacing: 0.05em;
        pointer-events: none;
        z-index: 999;
        text-align: center;
        white-space: nowrap;
        box-shadow: 0 10px 25px rgba(0,0,0,0.5);
      }
      #camera-error {
        display: none;
        position: fixed;
        top: 50%;
        left: 50%;
        transform: translate(-50%, -50%);
        background: rgba(18, 18, 18, 0.95);
        border: 2px solid #ef4444;
        color: white;
        padding: 24px;
        border-radius: 20px;
        max-width: 300px;
        text-align: center;
        z-index: 1000;
        box-shadow: 0 20px 40px rgba(0,0,0,0.8);
      }
      #camera-error h4 {
        margin: 0 0 10px 0;
        color: #ef4444;
        text-transform: uppercase;
        font-size: 14px;
        letter-spacing: 0.1em;
      }
      #camera-error p {
        margin: 0;
        font-size: 13px;
        color: #a3a3a3;
        line-height: 1.5;
      }
    </style>
  </head>
  <body>
    <!-- Overlay instructions -->
    <div id="ar-instructions">
      Scan 'Hiro' Marker with your camera to preview 🍕
    </div>

    <!-- Error indicator -->
    <div id="camera-error">
      <h4>Webcam Required</h4>
      <p>Please authorize camera access permissions to initialize the augmented reality pizza preview.</p>
    </div>

    <!-- AR.js A-Frame Scene -->
    <a-scene 
      embedded 
      arjs="sourceType: webcam; debugUIEnabled: false; trackingMethod: best;"
      renderer="antialias: true; colorManagement: true; exposure: 1.2; logarithmicDepthBuffer: true;"
      vr-mode-ui="enabled: false animate: false"
    >
      <a-assets>
        <a-asset-item id="pizza-model" src="https://cdn.tinyglb.com/models/783438f0cbd245478b4d9d8f2efc7d12.gib"></a-asset-item>
      </a-assets>

      <!-- Standard 'hiro' marker preset -->
      <a-marker preset="hiro">
        <!-- Renders the 3D Pizza Model (centered, slightly rotated for better initial angle, and slowly rotating) -->
        <a-entity 
          gltf-model="#pizza-model" 
          scale="1.8 1.8 1.8" 
          position="0 0.1 0" 
          rotation="0 0 0"
          animation="property: rotation; to: 0 360 0; loop: true; dur: 12000; easing: linear"
        >
        </a-entity>
      </a-marker>

      <!-- Camera viewport -->
      <a-entity camera></a-entity>
    </a-scene>

    <script>
      // Gracefully handle camera user-media check or permissions blocked
      navigator.mediaDevices.getUserMedia({ video: true })
        .catch(function(err) {
          console.warn("Camera access denied or unavailable:", err);
          document.getElementById('camera-error').style.display = 'block';
          document.getElementById('ar-instructions').style.display = 'none';
        });

      // Hide guidance tag transiently if hiro target is identified
      const marker = document.querySelector('a-marker');
      const instructionTag = document.getElementById('ar-instructions');
      
      marker.addEventListener('markerFound', () => {
        instructionTag.style.background = 'rgba(74, 222, 128, 0.95)';
        instructionTag.style.borderColor = 'rgba(255, 255, 255, 0.4)';
        instructionTag.textContent = 'Authentic Margherita Loaded! 🍕';
      });

      marker.addEventListener('markerLost', () => {
        instructionTag.style.background = 'rgba(0, 0, 0, 0.8)';
        instructionTag.style.borderColor = 'rgba(255, 255, 255, 0.15)';
        instructionTag.textContent = "Scan 'Hiro' Marker with your camera to preview 🍕";
      });
    </script>
  </body>
</html>
